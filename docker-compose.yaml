services:
  epgo:
    container_name: epgo
    build:
      context: .
      args:
        # Or arm64
        - TARGETARCH=amd64
    environment:
      - TZ=America/Chicago
    volumes:
      # Assumes config.yaml is in the same directory as this docker-compose.yaml
      - ./config.yaml:/Docker/epgo/config.yaml
    command: -config /Docker/epgo/config.yaml
    restart: no
