services:
  epgo:
    container_name: epgo
    build:
      context: .
      args:
        - TARGETARCH=amd64 # Change to arm64 if running on ARM architecture
    environment:
      - TZ=America/Chicago # Set to your local timezone
    volumes:
      - ./app/config.yaml:/app/epgo/config.yaml
    command:
      - -config
      - /app/epgo/config.yaml
    restart: no
